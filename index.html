<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        header{
            background:#0077ff;
            color:white;
            padding:20px;
            text-align:center;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:60px auto;
            text-align:center;
        }

        h1{
            font-size:40px;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            color:#555;
            margin-bottom:30px;
        }

        button{
            padding:12px 30px;
            border:none;
            background:#0077ff;
            color:white;
            font-size:18px;
            border-radius:5px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#005ecc;
        }

        footer{
            background:#222;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:80px;
        }
    </style>

</head>
<body>

<header>
    <h2>My Website</h2>
</header>

<div class="container">
    <h1>Welcome to My Website</h1>

    <p>
        This is a basic responsive website made using only HTML and CSS.
    </p>

    <button onclick="showMessage()">
        Click Me
    </button>
</div>

<footer>
    © 2026 My Website. All Rights Reserved.
</footer>

<script>
function showMessage(){
    alert("Thank you for visiting my website!");
}
</script>

</body>
</html>
